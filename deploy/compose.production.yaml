name: cat-maintain

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cat_maintain
      MYSQL_USER: catmaintain
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the server .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the server .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -uroot --silent --skip-column-names -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  backend:
    image: cat-maintain-backend:${APP_VERSION:?Set APP_VERSION}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cat_maintain?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: catmaintain
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=20.0'
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_SERVLET_SESSION_TIMEOUT: 30m
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: 'true'
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/api/health | grep -q ''"status":"UP"''']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    logging: *logging

  web:
    image: cat-maintain-web:${APP_VERSION:?Set APP_VERSION}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/api/health | grep -q ''"status":"UP"''']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  mysql-data:
