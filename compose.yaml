services:
  mysql:
    image: mysql:8.4
    container_name: cat-maintain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cat_maintain}
      MYSQL_USER: ${MYSQL_USER:-catmaintain}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-catmaintain}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-catmaintain_root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - cat-maintain-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cat-maintain-mysql-data:
